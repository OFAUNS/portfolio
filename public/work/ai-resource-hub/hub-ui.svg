<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-label="AI 資源整合 App 介面線框">
  <defs>
    <linearGradient id="uiBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0a14"/>
      <stop offset="100%" stop-color="#141026"/>
    </linearGradient>
    <style>
      .t { font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif; }
      .m { font-family: 'JetBrains Mono','Consolas',monospace; }
    </style>
  </defs>

  <rect width="1600" height="900" fill="url(#uiBg)"/>
  <text class="m" x="80" y="82" fill="#818cf8" font-size="20" letter-spacing="6">INTERFACE WIREFRAME</text>
  <text class="t" x="80" y="140" fill="#f2f0ff" font-size="42" font-weight="700">單一入口的資源瀏覽與調用</text>

  <rect x="80" y="190" width="1440" height="620" rx="18" fill="#100e1e" stroke="#818cf8" stroke-opacity="0.3"/>
  <line x1="80" y1="252" x2="1520" y2="252" stroke="#818cf8" stroke-opacity="0.2"/>
  <g>
    <circle cx="116" cy="221" r="7" fill="#f97066"/>
    <circle cx="140" cy="221" r="7" fill="#fbbf24"/>
    <circle cx="164" cy="221" r="7" fill="#a3e635"/>
    <text class="m" x="200" y="228" fill="#6d68a0" font-size="17">ai-hub · workspace</text>
  </g>

  <rect x="80" y="252" width="300" height="558" fill="#15132a" fill-opacity="0.7"/>
  <line x1="380" y1="252" x2="380" y2="810" stroke="#818cf8" stroke-opacity="0.2"/>
  <g class="t" fill="#9b96bd" font-size="21">
    <rect x="108" y="288" width="244" height="46" rx="10" fill="#2a2450"/>
    <text x="132" y="318" fill="#f2f0ff">全部資源</text>
    <text x="132" y="382">模型</text>
    <text x="132" y="434">提示詞</text>
    <text x="132" y="486">工具</text>
    <text x="132" y="538">知識庫</text>
    <text x="132" y="590">工作流</text>
    <line x1="108" y1="626" x2="352" y2="626" stroke="#818cf8" stroke-opacity="0.2"/>
    <text x="132" y="674">用量統計</text>
    <text x="132" y="726">設定</text>
  </g>

  <g class="t">
    <rect x="412" y="288" width="1076" height="56" rx="12" fill="#1a1730" stroke="#818cf8" stroke-opacity="0.3"/>
    <text x="444" y="324" fill="#6d68a0" font-size="21">搜尋資源、標籤或用途…</text>
  </g>

  <g class="t">
    <g>
      <rect x="412" y="376" width="340" height="180" rx="14" fill="#1a1730" stroke="#818cf8" stroke-opacity="0.35"/>
      <text class="m" x="440" y="414" fill="#f0abfc" font-size="16">MODEL</text>
      <text x="440" y="458" fill="#f2f0ff" font-size="26" font-weight="600">長文摘要</text>
      <text x="440" y="496" fill="#9b96bd" font-size="19">綁定預設參數與成本上限</text>
      <rect x="440" y="516" width="90" height="28" rx="14" fill="#2a2450"/>
      <text class="m" x="456" y="536" fill="#a5b4fc" font-size="15">在用</text>
    </g>
    <g>
      <rect x="780" y="376" width="340" height="180" rx="14" fill="#1a1730" stroke="#818cf8" stroke-opacity="0.35"/>
      <text class="m" x="808" y="414" fill="#f0abfc" font-size="16">PROMPT</text>
      <text x="808" y="458" fill="#f2f0ff" font-size="26" font-weight="600">標案摘要模板</text>
      <text x="808" y="496" fill="#9b96bd" font-size="19">v3 · 可回溯歷史版本</text>
      <rect x="808" y="516" width="90" height="28" rx="14" fill="#2a2450"/>
      <text class="m" x="824" y="536" fill="#a5b4fc" font-size="15">共用</text>
    </g>
    <g>
      <rect x="1148" y="376" width="340" height="180" rx="14" fill="#1a1730" stroke="#818cf8" stroke-opacity="0.35"/>
      <text class="m" x="1176" y="414" fill="#f0abfc" font-size="16">TOOL</text>
      <text x="1176" y="458" fill="#f2f0ff" font-size="26" font-weight="600">檔案轉換器</text>
      <text x="1176" y="496" fill="#9b96bd" font-size="19">本機腳本，離線可跑</text>
      <rect x="1176" y="516" width="90" height="28" rx="14" fill="#2a2450"/>
      <text class="m" x="1192" y="536" fill="#a5b4fc" font-size="15">本機</text>
    </g>
  </g>

  <g class="t">
    <rect x="412" y="588" width="1076" height="186" rx="14" fill="#15132a" stroke="#f0abfc" stroke-opacity="0.25"/>
    <text class="m" x="444" y="628" fill="#f0abfc" font-size="17" letter-spacing="3">USAGE THIS MONTH</text>
    <g>
      <rect x="444" y="656" width="1012" height="12" rx="6" fill="#241f45"/>
      <rect x="444" y="656" width="560" height="12" rx="6" fill="#818cf8"/>
      <rect x="1004" y="656" width="230" height="12" rx="6" fill="#f0abfc"/>
    </g>
    <text x="444" y="712" fill="#9b96bd" font-size="20">依資源類型拆分用量，超過門檻時直接在入口提示，不必事後對帳。</text>
    <text x="444" y="748" fill="#6d68a0" font-size="19">成本、金鑰與權限集中在同一層，換供應商不必改動上層流程。</text>
  </g>

  <text class="m" x="80" y="866" fill="#3d3760" font-size="18">PLACEHOLDER WIREFRAME — 待實際 App 畫面替換</text>
</svg>
