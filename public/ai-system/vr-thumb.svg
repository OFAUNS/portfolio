<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000" role="img" aria-label="VR 教育遊戲資料整合監控版架構圖">
  <defs>
    <linearGradient id="vrBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#100c04"/>
      <stop offset="100%" stop-color="#0b1418"/>
    </linearGradient>
    <marker id="vrArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#fbbf24"/>
    </marker>
    <style>
      .t { font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif; }
      .m { font-family: 'JetBrains Mono','Consolas',monospace; }
    </style>
  </defs>

  <rect width="1600" height="1000" fill="url(#vrBg)"/>
  <g stroke="#fbbf24" stroke-opacity="0.06">
    <path d="M0 250H1600M0 500H1600M0 750H1600"/>
    <path d="M320 0V1000M640 0V1000M960 0V1000M1280 0V1000"/>
  </g>

  <text class="m" x="80" y="92" fill="#fbbf24" font-size="22" letter-spacing="6">VR LEARNING TELEMETRY</text>
  <text class="t" x="80" y="160" fill="#fdf6e6" font-size="56" font-weight="700">VR 教育遊戲資料整合監控版</text>
  <text class="t" x="80" y="208" fill="#96897a" font-size="24">把頭戴裝置裡看不見的學習行為，變成教師端看得懂的即時指標</text>
  <line x1="80" y1="248" x2="1520" y2="248" stroke="#fbbf24" stroke-opacity="0.35" stroke-width="2"/>

  <g class="t">
    <g>
      <rect x="80" y="316" width="300" height="200" rx="16" fill="#1a1408" stroke="#fbbf24" stroke-opacity="0.45"/>
      <text class="m" x="108" y="358" fill="#fbbf24" font-size="18">SOURCE</text>
      <text x="108" y="410" fill="#fdf6e6" font-size="28" font-weight="600">VR 遊戲端</text>
      <text x="108" y="450" fill="#96897a" font-size="19">關卡進度、互動事件</text>
      <text x="108" y="482" fill="#96897a" font-size="19">停留時間、錯誤次數</text>
    </g>
    <g>
      <rect x="440" y="316" width="300" height="200" rx="16" fill="#0f1a1e" stroke="#22d3ee" stroke-opacity="0.45"/>
      <text class="m" x="468" y="358" fill="#22d3ee" font-size="18">INGEST</text>
      <text x="468" y="410" fill="#fdf6e6" font-size="28" font-weight="600">事件收集層</text>
      <text x="468" y="450" fill="#96897a" font-size="19">統一事件格式</text>
      <text x="468" y="482" fill="#96897a" font-size="19">離線暫存與補傳</text>
    </g>
    <g>
      <rect x="800" y="316" width="300" height="200" rx="16" fill="#0f1a1e" stroke="#22d3ee" stroke-opacity="0.45"/>
      <text class="m" x="828" y="358" fill="#22d3ee" font-size="18">STORE</text>
      <text x="828" y="410" fill="#fdf6e6" font-size="28" font-weight="600">資料整合</text>
      <text x="828" y="450" fill="#96897a" font-size="19">跨場次、跨班級合併</text>
      <text x="828" y="482" fill="#96897a" font-size="19">學習指標計算</text>
    </g>
    <g>
      <rect x="1160" y="316" width="360" height="200" rx="16" fill="#1a1408" stroke="#fbbf24" stroke-opacity="0.7"/>
      <text class="m" x="1188" y="358" fill="#fbbf24" font-size="18">MONITOR</text>
      <text x="1188" y="410" fill="#fdf6e6" font-size="28" font-weight="600">教師監控台</text>
      <text x="1188" y="450" fill="#96897a" font-size="19">即時進度牆與異常警示</text>
      <text x="1188" y="482" fill="#96897a" font-size="19">單人歷程回放</text>
    </g>
  </g>

  <g stroke="#fbbf24" stroke-width="2" marker-end="url(#vrArrow)" fill="none">
    <path d="M380 416H432"/>
    <path d="M740 416H792"/>
    <path d="M1100 416H1152"/>
  </g>

  <g class="t">
    <rect x="80" y="580" width="690" height="240" rx="16" fill="#0d1215" stroke="#22d3ee" stroke-opacity="0.25"/>
    <text class="m" x="112" y="626" fill="#22d3ee" font-size="18" letter-spacing="4">WHY IT MATTERS</text>
    <text x="112" y="678" fill="#fdf6e6" font-size="26">戴上頭盔之後，教師就失去了觀察權。</text>
    <text x="112" y="722" fill="#96897a" font-size="21">學生卡在哪一關、重複失敗幾次、是不是</text>
    <text x="112" y="754" fill="#96897a" font-size="21">已經放棄亂點，在傳統 VR 課堂裡完全看不到。</text>
    <text x="112" y="794" fill="#96897a" font-size="21">監控版把這層盲區補起來。</text>
  </g>

  <g class="t">
    <rect x="830" y="580" width="690" height="240" rx="16" fill="#0d1215" stroke="#fbbf24" stroke-opacity="0.25"/>
    <text class="m" x="862" y="626" fill="#fbbf24" font-size="18" letter-spacing="4">KEY SIGNALS</text>
    <text x="862" y="678" fill="#fdf6e6" font-size="24">· 關卡完成率與平均耗時</text>
    <text x="862" y="722" fill="#fdf6e6" font-size="24">· 重複失敗達門檻的即時警示</text>
    <text x="862" y="766" fill="#fdf6e6" font-size="24">· 互動熱區與視線停留分布</text>
  </g>

  <text class="m" x="80" y="924" fill="#4a4234" font-size="18">PLACEHOLDER DIAGRAM — 待實際監控台畫面替換</text>
</svg>
