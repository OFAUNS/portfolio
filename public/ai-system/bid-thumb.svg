<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000" role="img" aria-label="標案自動化工作流架構圖">
  <defs>
    <linearGradient id="bidBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#070d12"/>
      <stop offset="100%" stop-color="#0d1a20"/>
    </linearGradient>
    <linearGradient id="bidLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#a3e635"/>
    </linearGradient>
    <marker id="bidArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#22d3ee"/>
    </marker>
    <style>
      .t { font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif; }
      .m { font-family: 'JetBrains Mono','Consolas',monospace; }
    </style>
  </defs>

  <rect width="1600" height="1000" fill="url(#bidBg)"/>
  <g stroke="#22d3ee" stroke-opacity="0.07">
    <path d="M0 200H1600M0 400H1600M0 600H1600M0 800H1600"/>
    <path d="M200 0V1000M400 0V1000M600 0V1000M800 0V1000M1000 0V1000M1200 0V1000M1400 0V1000"/>
  </g>

  <text class="m" x="80" y="96" fill="#22d3ee" font-size="22" letter-spacing="6">BID AUTOMATION / n8n + LLM</text>
  <text class="t" x="80" y="164" fill="#eaf6f8" font-size="56" font-weight="700">標案自動化工作流</text>
  <text class="t" x="80" y="212" fill="#7f9aa3" font-size="24">從機會獵尋到提案初稿的六段流水線</text>
  <line x1="80" y1="252" x2="1520" y2="252" stroke="url(#bidLine)" stroke-width="2" stroke-opacity="0.5"/>

  <g class="t">
    <g>
      <rect x="80" y="320" width="220" height="160" rx="14" fill="#0f1f26" stroke="#22d3ee" stroke-opacity="0.45"/>
      <text class="m" x="104" y="360" fill="#22d3ee" font-size="18">01</text>
      <text x="104" y="404" fill="#eaf6f8" font-size="26" font-weight="600">機會獵尋</text>
      <text x="104" y="440" fill="#7f9aa3" font-size="18">政府電子採購網</text>
      <text x="104" y="464" fill="#7f9aa3" font-size="18">排程掃描</text>
    </g>
    <g>
      <rect x="340" y="320" width="220" height="160" rx="14" fill="#0f1f26" stroke="#22d3ee" stroke-opacity="0.45"/>
      <text class="m" x="364" y="360" fill="#22d3ee" font-size="18">02</text>
      <text x="364" y="404" fill="#eaf6f8" font-size="26" font-weight="600">RFP 解析</text>
      <text x="364" y="440" fill="#7f9aa3" font-size="18">需求書拆解為</text>
      <text x="364" y="464" fill="#7f9aa3" font-size="18">結構化條件</text>
    </g>
    <g>
      <rect x="600" y="320" width="220" height="160" rx="14" fill="#0f1f26" stroke="#22d3ee" stroke-opacity="0.45"/>
      <text class="m" x="624" y="360" fill="#22d3ee" font-size="18">03</text>
      <text x="624" y="404" fill="#eaf6f8" font-size="26" font-weight="600">組織記憶</text>
      <text x="624" y="440" fill="#7f9aa3" font-size="18">過往得標／落標</text>
      <text x="624" y="464" fill="#7f9aa3" font-size="18">實績比對</text>
    </g>
    <g>
      <rect x="860" y="320" width="220" height="160" rx="14" fill="#0f1f26" stroke="#a3e635" stroke-opacity="0.5"/>
      <text class="m" x="884" y="360" fill="#a3e635" font-size="18">04</text>
      <text x="884" y="404" fill="#eaf6f8" font-size="26" font-weight="600">三維評分</text>
      <text x="884" y="440" fill="#7f9aa3" font-size="18">契合度／效益／</text>
      <text x="884" y="464" fill="#7f9aa3" font-size="18">成本風險</text>
    </g>
    <g>
      <rect x="1120" y="320" width="220" height="160" rx="14" fill="#1a1d0f" stroke="#a3e635" stroke-opacity="0.7"/>
      <text class="m" x="1144" y="360" fill="#a3e635" font-size="18">05</text>
      <text x="1144" y="404" fill="#eaf6f8" font-size="26" font-weight="600">人類決策點</text>
      <text x="1144" y="440" fill="#a8b98a" font-size="18">賽局策略與</text>
      <text x="1144" y="464" fill="#a8b98a" font-size="18">差異化定位注入</text>
    </g>
    <g>
      <rect x="1380" y="320" width="140" height="160" rx="14" fill="#0f1f26" stroke="#22d3ee" stroke-opacity="0.45"/>
      <text class="m" x="1404" y="360" fill="#22d3ee" font-size="18">06</text>
      <text x="1404" y="404" fill="#eaf6f8" font-size="26" font-weight="600">提案</text>
      <text x="1404" y="440" fill="#7f9aa3" font-size="18">Word</text>
      <text x="1404" y="464" fill="#7f9aa3" font-size="18">初稿</text>
    </g>
  </g>

  <g stroke="#22d3ee" stroke-width="2" marker-end="url(#bidArrow)" fill="none">
    <path d="M300 400H332"/>
    <path d="M560 400H592"/>
    <path d="M820 400H852"/>
    <path d="M1080 400H1112"/>
    <path d="M1340 400H1372"/>
  </g>

  <g class="t">
    <rect x="80" y="560" width="1440" height="180" rx="16" fill="#0b161b" stroke="#22d3ee" stroke-opacity="0.2"/>
    <text class="m" x="112" y="606" fill="#a3e635" font-size="18" letter-spacing="4">HUMAN-IN-THE-LOOP</text>
    <text x="112" y="656" fill="#eaf6f8" font-size="28">自動化只負責「篩掉不值得投的案子」，不負責決定要投哪一案。</text>
    <text x="112" y="700" fill="#7f9aa3" font-size="22">評分結果送到人類專家手上時，已經附帶條件對照表與過往實績佐證，決策成本從數小時壓到數分鐘。</text>
  </g>

  <g class="m" fill="#4d6870" font-size="18">
    <text x="80" y="828">STACK</text>
    <text x="80" y="866" fill="#7f9aa3">n8n · LLM Agent · Web Scraping · DOCX Generation · A4 標楷體 12pt / 1.5 倍行高</text>
    <text x="80" y="928" fill="#334b52">PLACEHOLDER DIAGRAM — 待實際系統畫面替換</text>
  </g>
</svg>
