<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-label="VR 教育遊戲教師監控台線框">
  <defs>
    <linearGradient id="dbBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#100c04"/>
      <stop offset="100%" stop-color="#0b1418"/>
    </linearGradient>
    <style>
      .t { font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif; }
      .m { font-family: 'JetBrains Mono','Consolas',monospace; }
    </style>
  </defs>

  <rect width="1600" height="900" fill="url(#dbBg)"/>
  <text class="m" x="80" y="82" fill="#fbbf24" font-size="20" letter-spacing="6">TEACHER CONSOLE</text>
  <text class="t" x="80" y="140" fill="#fdf6e6" font-size="42" font-weight="700">課堂即時監控台</text>

  <g class="t">
    <g>
      <rect x="80" y="192" width="340" height="150" rx="14" fill="#161108" stroke="#fbbf24" stroke-opacity="0.35"/>
      <text class="m" x="108" y="232" fill="#96897a" font-size="17">ACTIVE HEADSETS</text>
      <text class="m" x="108" y="300" fill="#fbbf24" font-size="52" font-weight="700">24</text>
      <text x="212" y="300" fill="#96897a" font-size="21" class="t">/ 28 在線</text>
    </g>
    <g>
      <rect x="452" y="192" width="340" height="150" rx="14" fill="#0f1a1e" stroke="#22d3ee" stroke-opacity="0.35"/>
      <text class="m" x="480" y="232" fill="#96897a" font-size="17">AVG COMPLETION</text>
      <text class="m" x="480" y="300" fill="#22d3ee" font-size="52" font-weight="700">63%</text>
      <text x="622" y="300" fill="#96897a" font-size="21" class="t">關卡進度</text>
    </g>
    <g>
      <rect x="824" y="192" width="340" height="150" rx="14" fill="#1c1108" stroke="#f97066" stroke-opacity="0.45"/>
      <text class="m" x="852" y="232" fill="#96897a" font-size="17">NEEDS ATTENTION</text>
      <text class="m" x="852" y="300" fill="#f97066" font-size="52" font-weight="700">3</text>
      <text x="906" y="300" fill="#96897a" font-size="21" class="t">位學生重複失敗</text>
    </g>
    <g>
      <rect x="1196" y="192" width="324" height="150" rx="14" fill="#0f1a1e" stroke="#a3e635" stroke-opacity="0.35"/>
      <text class="m" x="1224" y="232" fill="#96897a" font-size="17">SESSION TIME</text>
      <text class="m" x="1224" y="300" fill="#a3e635" font-size="52" font-weight="700">32:14</text>
    </g>
  </g>

  <g class="t">
    <rect x="80" y="378" width="900" height="330" rx="16" fill="#0d1215" stroke="#22d3ee" stroke-opacity="0.25"/>
    <text class="m" x="112" y="420" fill="#22d3ee" font-size="18" letter-spacing="4">PROGRESS WALL</text>
    <text x="112" y="456" fill="#96897a" font-size="19">每一列是一位學生，色塊代表已通過的關卡</text>
    <g>
      <rect x="112" y="482" width="120" height="26" rx="6" fill="#22d3ee"/>
      <rect x="240" y="482" width="120" height="26" rx="6" fill="#22d3ee"/>
      <rect x="368" y="482" width="120" height="26" rx="6" fill="#22d3ee"/>
      <rect x="496" y="482" width="120" height="26" rx="6" fill="#1b3138"/>
      <rect x="624" y="482" width="120" height="26" rx="6" fill="#1b3138"/>
      <text class="m" x="768" y="502" fill="#7f9aa3" font-size="17">S-014</text>
    </g>
    <g>
      <rect x="112" y="524" width="120" height="26" rx="6" fill="#22d3ee"/>
      <rect x="240" y="524" width="120" height="26" rx="6" fill="#22d3ee"/>
      <rect x="368" y="524" width="120" height="26" rx="6" fill="#f97066"/>
      <rect x="496" y="524" width="120" height="26" rx="6" fill="#1b3138"/>
      <rect x="624" y="524" width="120" height="26" rx="6" fill="#1b3138"/>
      <text class="m" x="768" y="544" fill="#f97066" font-size="17">S-021 卡關</text>
    </g>
    <g>
      <rect x="112" y="566" width="120" height="26" rx="6" fill="#22d3ee"/>
      <rect x="240" y="566" width="120" height="26" rx="6" fill="#22d3ee"/>
      <rect x="368" y="566" width="120" height="26" rx="6" fill="#22d3ee"/>
      <rect x="496" y="566" width="120" height="26" rx="6" fill="#22d3ee"/>
      <rect x="624" y="566" width="120" height="26" rx="6" fill="#a3e635"/>
      <text class="m" x="768" y="586" fill="#a3e635" font-size="17">S-003 完成</text>
    </g>
    <g>
      <rect x="112" y="608" width="120" height="26" rx="6" fill="#22d3ee"/>
      <rect x="240" y="608" width="120" height="26" rx="6" fill="#1b3138"/>
      <rect x="368" y="608" width="120" height="26" rx="6" fill="#1b3138"/>
      <rect x="496" y="608" width="120" height="26" rx="6" fill="#1b3138"/>
      <rect x="624" y="608" width="120" height="26" rx="6" fill="#1b3138"/>
      <text class="m" x="768" y="628" fill="#7f9aa3" font-size="17">S-027</text>
    </g>
    <text class="m" x="112" y="676" fill="#4a4234" font-size="16">LV.01        LV.02        LV.03        LV.04        LV.05</text>
  </g>

  <g class="t">
    <rect x="1012" y="378" width="508" height="330" rx="16" fill="#0d1215" stroke="#fbbf24" stroke-opacity="0.25"/>
    <text class="m" x="1044" y="420" fill="#fbbf24" font-size="18" letter-spacing="4">ALERT FEED</text>
    <g>
      <rect x="1044" y="446" width="444" height="70" rx="10" fill="#1c1108" stroke="#f97066" stroke-opacity="0.35"/>
      <text x="1068" y="480" fill="#fdf6e6" font-size="21">S-021 於 LV.03 連續失敗 5 次</text>
      <text class="m" x="1068" y="506" fill="#96897a" font-size="16">00:28:41 · 建議介入</text>
    </g>
    <g>
      <rect x="1044" y="530" width="444" height="70" rx="10" fill="#161108" stroke="#fbbf24" stroke-opacity="0.3"/>
      <text x="1068" y="564" fill="#fdf6e6" font-size="21">S-027 靜止超過 3 分鐘</text>
      <text class="m" x="1068" y="590" fill="#96897a" font-size="16">00:26:12 · 可能已脫離</text>
    </g>
    <g>
      <rect x="1044" y="614" width="444" height="70" rx="10" fill="#0f1a1e" stroke="#22d3ee" stroke-opacity="0.3"/>
      <text x="1068" y="648" fill="#fdf6e6" font-size="21">S-009 裝置斷線後已補傳</text>
      <text class="m" x="1068" y="674" fill="#96897a" font-size="16">00:19:55 · 資料完整</text>
    </g>
  </g>

  <text class="m" x="80" y="784" fill="#96897a" font-size="20" class="t">警示門檻可依關卡難度個別設定，避免把「本來就難的關」誤報成學習障礙。</text>
  <text class="m" x="80" y="852" fill="#4a4234" font-size="18">PLACEHOLDER WIREFRAME — 待實際監控台畫面替換</text>
</svg>
